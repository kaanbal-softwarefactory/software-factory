apiVersion: kustomize.config.k8s.io/v1beta1

kind: Kustomization



resources:

  - ../../base



namespace: dev



commonLabels:

  environment: dev



images:

  - name: nginx:stable-alpine

    newName: acme-dockerhub/placeholder-app

    newTag: pending-initial-build



patches:

  # Dev default: Tailscale only — remove public nginx Ingress

  - target:

      kind: Ingress

      name: placeholder-app

    patch: |-

      $patch: delete

      apiVersion: networking.k8s.io/v1

      kind: Ingress

      metadata:

        name: placeholder-app

