apiVersion: apps/v1
kind: Deployment
metadata:
  name: placeholder-app
  labels:
    app: placeholder-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: placeholder-app
  template:
    metadata:
      labels:
        app: placeholder-app
    spec:
      containers:
      - name: placeholder-app
        image: nginx:stable-alpine
        ports:
        - containerPort: 3000
        env:
        - name: APP_NAME
          value: placeholder-app
        - name: APP_ENV
          value: production
        - name: NODE_ENV
          value: production
        envFrom:
        - secretRef:
            name: placeholder-app-secrets
            optional: true
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 10
        startupProbe:
          httpGet:
            path: /api/health
            port: 3000
          failureThreshold: 30
          periodSeconds: 5
