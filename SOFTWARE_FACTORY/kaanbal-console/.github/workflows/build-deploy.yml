# ==============================================================================
# GITHUB ACTIONS - Kaanbal Console (Build + Deploy)
# ==============================================================================
name: Build & Deploy

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

env:
  APP_NAME: kaanbal-console

jobs:
  build-push:
    name: "Build & Push Docker Image"
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Set image metadata
        id: meta
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "tag=prod-${SHORT_SHA}" >> $GITHUB_OUTPUT
            echo "env=prod" >> $GITHUB_OUTPUT
          else
            echo "tag=dev-${SHORT_SHA}" >> $GITHUB_OUTPUT
            echo "env=dev" >> $GITHUB_OUTPUT
          fi

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.APP_NAME }}:${{ steps.meta.outputs.tag }}

  update-infra:
    name: "Update Infra GitOps"
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout infra-gitops
        run: |
          git clone --depth 1 https://${{ secrets.INFRA_GIT_USER }}:${{ secrets.INFRA_GIT_TOKEN }}@github.com/${{ github.repository_owner }}/infra-gitops.git
          cd infra-gitops
          git config user.email "pipeline@${{ vars.DOMAIN || 'kaanbal.local' }}"
          git config user.name "GitHub Actions"

      - name: Update kustomization
        run: |
          cd infra-gitops
          ENV_DIR="apps/${{ env.APP_NAME }}/overlays"
          if [ "${{ github.ref_name }}" = "main" ]; then
            TARGET_DIR="${ENV_DIR}/prod"
          else
            TARGET_DIR="${ENV_DIR}/dev"
          fi

          # Fallback to base if overlay doesn't exist
          if [ ! -d "$TARGET_DIR" ]; then
            TARGET_DIR="apps/${{ env.APP_NAME }}/base"
          fi

          FULL_IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/${{ env.APP_NAME }}"
          IMAGE_TAG="${{ needs.build-push.outputs.image_tag }}"

          cd "$TARGET_DIR"
          sed -i "s|newName:.*|newName: ${FULL_IMAGE}|g" kustomization.yaml
          sed -i "s|newTag:.*|newTag: ${IMAGE_TAG}|g" kustomization.yaml

          cd -
          git add .
          git commit -m "deploy(${{ github.ref_name == 'main' && 'prod' || 'dev' }}): ${{ env.APP_NAME }} to ${IMAGE_TAG} [skip ci]" || echo "No changes"
          git pull --rebase origin main
          git push origin main
