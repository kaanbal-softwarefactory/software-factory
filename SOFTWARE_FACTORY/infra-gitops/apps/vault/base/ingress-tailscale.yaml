# Vault UI — acceso privado por Tailscale.
#
# Solo se publica si el operador de Tailscale entra en el baseline: sin él la
# IngressClass "tailscale" no existe, el Ingress queda huérfano y ArgoCD reporta
# vault en Progressing para siempre por una UI que nadie puede alcanzar.
#
# @kaanbal:if TAILSCALE
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vault-ui
  namespace: vault
  labels:
    app: vault
    software-factory.io/exposure: private
  annotations:
    tailscale.com/hostname: "vault"
    tailscale.com/tags: "tag:k8s"
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: vault
      port:
        number: 8200
# @kaanbal:endif
