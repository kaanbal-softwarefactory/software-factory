apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

namespace: prod

commonLabels:
  environment: prod

patchesStrategicMerge:
  - patch-deployment-labels.yaml

# El tag lo fija el instalador en el bootstrap y a partir de ahí lo actualiza
# el workflow de GitHub Actions del repo kaanbal-console en cada push a main.
images:
  - name: kaanbal-console-image
    newName: ${KAANBAL_DOCKER_USER}/kaanbal-console
    newTag: ${KAANBAL_CONSOLE_TAG}
