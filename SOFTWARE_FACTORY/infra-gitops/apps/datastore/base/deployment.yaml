apiVersion: apps/v1
kind: Deployment
metadata:
  name: datastore
  labels:
    app: datastore
    software-factory.io/core: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: datastore
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: datastore
    spec:
      containers:
      - name: mongodb
        image: mongo:7
        ports:
        - containerPort: 27017
        env:
        - name: MONGO_INITDB_ROOT_USERNAME
          valueFrom:
            secretKeyRef:
              name: datastore-credentials
              key: root-username
        - name: MONGO_INITDB_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: datastore-credentials
              key: root-password
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          exec:
            command:
            - mongosh
            - --eval
            - "db.adminCommand('ping')"
          initialDelaySeconds: 60
          periodSeconds: 60
          timeoutSeconds: 30
          failureThreshold: 5
        readinessProbe:
          exec:
            command:
            - mongosh
            - --eval
            - "db.adminCommand('ping')"
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 30
          failureThreshold: 5
        volumeMounts:
        - name: datastore-data
          mountPath: /data/db
      volumes:
      - name: datastore-data
        persistentVolumeClaim:
          claimName: datastore-data
