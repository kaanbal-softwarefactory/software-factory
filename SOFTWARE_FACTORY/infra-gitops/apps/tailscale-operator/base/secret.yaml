# ==============================================================================
# TAILSCALE OPERATOR - OAUTH CREDENTIALS
# ==============================================================================
# IMPORTANTE: Este secret debe ser creado MANUALMENTE o via Terraform
# porque contiene credenciales sensibles que no deben estar en Git.
#
# Opción 1: Crear manualmente en el cluster:
#   kubectl create secret generic operator-oauth \
#     --namespace tailscale \
#     --from-literal=client_id="YOUR_CLIENT_ID" \
#     --from-literal=client_secret="YOUR_CLIENT_SECRET"
#
# Opción 2: Usar Sealed Secrets o Vault (recomendado para producción)
#
# Opción 3: Terraform (ver infra-gitops/terraform/tailscale.tf)
# ==============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: operator-oauth
  namespace: tailscale
  annotations:
    # ArgoCD: No sobrescribir si ya existe (gestionado por Terraform/kubectl)
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true,Replace=false
    argocd.argoproj.io/compare-options: IgnoreExtraneous
type: Opaque
stringData:
  # PLACEHOLDER - Actualizar manualmente con:
  # kubectl delete secret operator-oauth -n tailscale
  # kubectl create secret generic operator-oauth -n tailscale \
  #   --from-literal=client_id="YOUR_ID" \
  #   --from-literal=client_secret="YOUR_SECRET"
  client_id: "PLACEHOLDER"
  client_secret: "PLACEHOLDER"
