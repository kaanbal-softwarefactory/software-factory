# ==============================================================================
# TAILSCALE INGRESS CLASS
# ==============================================================================
# Esta IngressClass permite crear Ingress que solo son accesibles via Tailscale.
# Uso: En tu Ingress, pon `ingressClassName: tailscale`
# ==============================================================================
apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata:
  name: tailscale
  labels:
    app.kubernetes.io/name: tailscale
  annotations:
    # NO es el default - nginx sigue siendo el default para apps públicas
    ingressclass.kubernetes.io/is-default-class: "false"
spec:
  controller: tailscale.com/ts-ingress
