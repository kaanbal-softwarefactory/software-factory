name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  business-base:
    name: Business base acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: SOFTWARE_FACTORY/business-base
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: SOFTWARE_FACTORY/business-base/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium --only-shell
      - run: npm run local:up
      - run: docker compose -p business-reference run --rm --no-deps migrate npm run test:integration
      - run: npm run test:browser
      - run: npm run local:up -- --name business-barber-test --port 3200 --identity-port 8280 --mail-port 8225 --preset barber --title "Barbería Demo"
      - run: npm run test:copies
      - name: Managed identity bootstrap acceptance
        run: |
          docker compose -p business-managed-acceptance -f compose.acceptance.yaml up -d --build acceptance
          test "$(docker wait business-managed-acceptance-acceptance-1)" = 0
          docker compose -p business-managed-acceptance -f compose.acceptance.yaml logs acceptance
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: business-base-preview
          path: SOFTWARE_FACTORY/business-base/coverage/browser/*.png
      - if: always()
        run: npm run local:stop
      - if: always()
        run: npm run local:stop -- --name business-barber-test
      - if: always()
        run: docker compose -p business-managed-acceptance -f compose.acceptance.yaml stop

  api:
    name: API tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: SOFTWARE_FACTORY/kaanbal-api
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: SOFTWARE_FACTORY/kaanbal-api/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Autonomy contracts in isolated processes
        run: |
          python tests/contract_autonomy.py
          python tests/contract_autonomy_api.py
          python tests/contract_autonomy_flow.py

  console:
    name: Console build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: SOFTWARE_FACTORY/kaanbal-console
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: SOFTWARE_FACTORY/kaanbal-console/package-lock.json
      - run: npm ci
      - run: npm run build

  mcp:
    name: MCP server tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: SOFTWARE_FACTORY/kaanbal-mcp
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: SOFTWARE_FACTORY/kaanbal-mcp/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests
