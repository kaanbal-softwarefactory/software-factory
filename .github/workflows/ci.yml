name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: SOFTWARE_FACTORY/kaanbal-api
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: SOFTWARE_FACTORY/kaanbal-api/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Autonomy contracts in isolated processes
        run: |
          python tests/contract_autonomy.py
          python tests/contract_autonomy_api.py
          python tests/contract_autonomy_flow.py

  console:
    name: Console build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: SOFTWARE_FACTORY/kaanbal-console
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: SOFTWARE_FACTORY/kaanbal-console/package-lock.json
      - run: npm ci
      - run: npm run build

  mcp:
    name: MCP server tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: SOFTWARE_FACTORY/kaanbal-mcp
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: SOFTWARE_FACTORY/kaanbal-mcp/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests
